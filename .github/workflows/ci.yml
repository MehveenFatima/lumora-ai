name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lumora
          POSTGRES_PASSWORD: lumora
          POSTGRES_DB: lumora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumora -d lumora_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Tests (in-memory store, no external services)
        run: python -m pytest backend/tests -q
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://lumora:lumora@localhost:5432/lumora_test
        run: python -m backend.app.cli migrate
      - name: Tests (PostgreSQL + pgvector)
        env:
          DATABASE_URL: postgresql://lumora:lumora@localhost:5432/lumora_test
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t lumora-api .
      - name: Build web image
        run: docker build -t lumora-web .
      - name: Smoke-test the API image
        run: |
          docker run -d --name api -p 8000:8000 lumora-api
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
