# Free hosting tiers go to sleep when nobody uses them: Render stops the API after 15 minutes
# without requests (the next visit then waits about a minute while it starts, and background
# work such as writing quiz questions is cut off), and Supabase pauses an inactive database.
# This pings the health check every 10 minutes through the website, which keeps both awake.
# Set the repository variable APP_URL to change the address.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/keep-awake.yml"]

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check the AI providers with a real request (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          APP_URL: ${{ vars.APP_URL || 'https://lumora-ai-alpha.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --max-time 100 -H "X-Cron-Secret: $CRON_SECRET" \
            "$APP_URL/api/v1/health?check_ai=true" -o ai.json || true
          # Prints only status, model and a short reason: no keys are in the report
          python3 - <<'PY'
          import json
          try:
              ai = json.load(open("ai.json")).get("ai", {})
          except Exception as e:
              print("No health report:", e); raise SystemExit
          for name, p in ai.get("providers", {}).items():
              print(f"provider {name}: status={p.get('status')} model={p.get('model') or p.get('model_name')}")
          for name, r in (ai.get("live_check") or {}).items():
              print(f"live {name}: {'OK' if r.get('ok') else 'FAILED'} model={r.get('model')} "
                    f"{str(r.get('latency_ms', '')) + ' ms' if r.get('ok') else r.get('error')}")
          if "live_check" not in ai:
              print("live check not run (CRON_SECRET missing or different)")
          PY
      - name: Ping the health check
        env:
          APP_URL: ${{ vars.APP_URL || 'https://lumora-ai-alpha.vercel.app' }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 100 -o health.json -w "%{http_code}" \
              "$APP_URL/api/v1/health?check_db=true" || echo 000)
            echo "Attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          # Show why (the database part of the health report holds no secrets, only a short reason)
          db=$(python3 -c "import json; d=json.load(open('health.json')).get('database', {}); print(d.get('status'), d.get('error') or '')" 2>/dev/null || echo "no health report")
          echo "::error title=API health check failed::HTTP $code, database: $db"
          exit 1
