# Free hosting tiers go to sleep when nobody uses them: Render stops the API after 15 minutes
# without requests (the next visit then waits about a minute while it starts, and background
# work such as writing quiz questions is cut off), and Supabase pauses an inactive database.
# This pings the health check every 10 minutes through the website, which keeps both awake.
# Set the repository variable APP_URL to change the address.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/keep-awake.yml"]

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the health check
        env:
          APP_URL: ${{ vars.APP_URL || 'https://lumora-ai-alpha.vercel.app' }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 100 -o health.json -w "%{http_code}" \
              "$APP_URL/api/v1/health?check_db=true" || echo 000)
            echo "Attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          # Show why (the database part of the health report holds no secrets, only a short reason)
          db=$(python3 -c "import json; d=json.load(open('health.json')).get('database', {}); print(d.get('status'), d.get('error') or '')" 2>/dev/null || echo "no health report")
          echo "::error title=API health check failed::HTTP $code, database: $db"
          exit 1
